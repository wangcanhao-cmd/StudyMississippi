name: Sync Mississippi resource hero images

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These two slots cover 2:00 PM Mississippi time
    # across daylight-saving changes; the cadence gate below runs the sync
    # only on alternating local calendar days and skips the other slot.
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
  push:
    paths:
      - ".github/workflows/sync-mississippi-resource-heroes.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check 48-hour Mississippi schedule
        id: cadence
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs and workflow-file pushes are allowed to run immediately.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, date, timezone
          from zoneinfo import ZoneInfo
          import os

          schedule = "${{ github.event.schedule }}"
          utc_hour = 19 if schedule.startswith("0 19 ") else 20
          now_utc = datetime.now(timezone.utc)
          nominal_utc = datetime(now_utc.year, now_utc.month, now_utc.day, utc_hour, 0, tzinfo=timezone.utc)
          local = nominal_utc.astimezone(ZoneInfo("America/Chicago"))
          anchor = date(2026, 10, 10)

          run = local.hour == 14 and ((local.date() - anchor).days % 2 == 0)
          print(f"run={'true' if run else 'false'}")
          print(f"nominal_local={local.isoformat()}")
          PY

      - name: Check out repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser and image tools
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ms-hero-sync
          cd /tmp/ms-hero-sync
          npm init -y >/dev/null 2>&1
          npm install playwright sharp >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Extract actual homepage hero media
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/external

          cat > /tmp/ms-hero-sync/sync.mjs <<'EOF'
          import { chromium } from "playwright";
          import sharp from "sharp";
          import fs from "node:fs/promises";
          import path from "node:path";

          process.chdir(process.env.GITHUB_WORKSPACE);

          const targets = [
            {
              name: "explore-mississippi",
              url: "https://exploremississippi.com/",
              out: "assets/external/explore-mississippi-hero.webp",
            },
            {
              name: "visit-mississippi",
              url: "https://visitmississippi.org/",
              out: "assets/external/visit-mississippi-hero.webp",
            },
          ];

          const browser = await chromium.launch({headless:true});
          const manifest = {};

          async function downloadImage(page, url, referer) {
            // First try a normal browser navigation to the image URL.
            const imagePage = await page.context().newPage();
            try {
              const res = await imagePage.goto(url, {
                waitUntil: "commit",
                timeout: 90000,
                referer
              });
              if (!res) throw new Error(`No response for ${url}`);
              if (!res.ok()) throw new Error(`HTTP ${res.status()} for ${url}`);
              const type = res.headers()["content-type"] || "";
              if (!type.startsWith("image/")) {
                throw new Error(`Not an image (${type}) for ${url}`);
              }
              return Buffer.from(await res.body());
            } finally {
              await imagePage.close();
            }
          }

          async function downloadImageInPage(page, url) {
            // Some sites return an HTML challenge to direct image navigation while
            // still allowing the image to load from inside their own page. Fetch it
            // in the already-loaded same-origin page and return the exact bytes.
            const payload = await page.evaluate(async absoluteUrl => {
              const response = await fetch(absoluteUrl, {
                credentials: "include",
                cache: "no-store"
              });
              const type = response.headers.get("content-type") || "";
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              if (!type.startsWith("image/")) throw new Error(`Not an image (${type})`);

              const bytes = new Uint8Array(await response.arrayBuffer());
              let binary = "";
              const chunk = 0x8000;
              for (let i = 0; i < bytes.length; i += chunk) {
                binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
              }
              return {type, base64:btoa(binary)};
            }, url);

            return Buffer.from(payload.base64, "base64");
          }

          async function captureRenderedHero(page) {
            // Last-resort fallback: capture the hero/video area as Chromium actually
            // renders it. This avoids breaking the whole sync when an origin blocks
            // direct binary access to the underlying image file.
            const selector = await page.evaluate(() => {
              document.querySelectorAll("[data-studyms-hero-capture]").forEach(el => {
                el.removeAttribute("data-studyms-hero-capture");
              });

              const scored = [];
              for (const el of document.querySelectorAll("video, main section, main div, body > div")) {
                const r = el.getBoundingClientRect();
                if (r.width < 800 || r.height < 300) continue;
                if (r.height > 1300) continue;
                if (r.bottom < 0 || r.top > 900) continue;
                const style = getComputedStyle(el);
                if (style.display === "none" || style.visibility === "hidden") continue;

                const visibleTop = Math.max(0, r.top);
                const visibleBottom = Math.min(1000, r.bottom);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                const area = Math.min(1600, r.width) * visibleHeight;
                const topBonus = r.top < 180 ? 2.2 : r.top < 450 ? 1.4 : 0.8;
                const videoBonus = el.tagName === "VIDEO" ? 2.5 : 1;
                scored.push({el, score:area * topBonus * videoBonus});
              }

              scored.sort((a,b) => b.score - a.score);
              const best = scored[0]?.el;
              if (!best) return null;
              best.setAttribute("data-studyms-hero-capture", "1");
              return "[data-studyms-hero-capture=\"1\"]";
            });

            if (!selector) throw new Error("No suitable rendered hero element found");
            const locator = page.locator(selector);
            await locator.scrollIntoViewIfNeeded();
            return await locator.screenshot({type:"png"});
          }

          for (const target of targets) {
            const context = await browser.newContext({viewport:{width:1600,height:1000}});
            const page = await context.newPage();
            console.log(`Loading ${target.url}`);

            await page.goto(target.url, {waitUntil:"domcontentloaded", timeout:90000});
            await page.waitForTimeout(6000);

            const candidates = await page.evaluate(() => {
              const out = [];
              const add = (url, el, kind) => {
                if (!url || url.startsWith("data:") || url.startsWith("blob:")) return;
                const r = el.getBoundingClientRect();
                if (r.width < 450 || r.height < 220) return;
                if (r.bottom < 0 || r.top > 1050) return;
                const visible = getComputedStyle(el).display !== "none" && getComputedStyle(el).visibility !== "hidden";
                if (!visible) return;

                const clippedTop = Math.max(0, r.top);
                const clippedBottom = Math.min(1000, r.bottom);
                const visibleHeight = Math.max(0, clippedBottom - clippedTop);
                const visibleArea = Math.max(0, Math.min(1600, r.width)) * visibleHeight;
                const topBonus = r.top < 180 ? 2.0 : r.top < 500 ? 1.2 : 0.7;
                const widthBonus = r.width > 1100 ? 1.35 : 1;
                out.push({
                  url,
                  kind,
                  width:r.width,
                  height:r.height,
                  top:r.top,
                  score:visibleArea * topBonus * widthBonus
                });
              };

              for (const el of document.querySelectorAll("body *")) {
                const bg = getComputedStyle(el).backgroundImage || "";
                const matches = [...bg.matchAll(/url\((['"]?)(.*?)\1\)/g)];
                for (const m of matches) add(m[2], el, "background");
              }

              for (const img of document.querySelectorAll("img")) {
                add(img.currentSrc || img.src, img, "img");
              }

              for (const video of document.querySelectorAll("video")) {
                add(video.poster, video, "video-poster");
              }

              out.sort((a,b)=>b.score-a.score);

              const og = document.querySelector('meta[property="og:image"]')?.content;
              if (og) out.push({url:og,kind:"og:image",width:0,height:0,top:0,score:1});

              return out.slice(0,30);
            });

            let chosen = null;
            let buffer = null;
            let errors = [];

            for (const c of candidates) {
              const absolute = new URL(c.url, page.url()).href;
              for (const method of ["direct", "in-page"]) {
                try {
                  const b = method === "direct"
                    ? await downloadImage(page, absolute, target.url)
                    : await downloadImageInPage(page, absolute);
                  const meta = await sharp(b, {failOn:"none"}).metadata();
                  if ((meta.width || 0) < 800 || (meta.height || 0) < 350) {
                    errors.push(`${method}: too small ${meta.width}x${meta.height}: ${absolute}`);
                    continue;
                  }
                  chosen = {
                    ...c,
                    url:absolute,
                    kind: method === "direct" ? c.kind : `${c.kind}-same-origin-fetch`,
                    intrinsicWidth:meta.width,
                    intrinsicHeight:meta.height
                  };
                  buffer = b;
                  break;
                } catch (e) {
                  errors.push(`${method}: ${String(e)}`);
                }
              }
              if (chosen && buffer) break;
            }

            // Visit Mississippi currently uses this hero-video poster. If the
            // generic candidate extraction misses it, retry the known URL using both
            // transfer methods before falling back to a rendered hero screenshot.
            if (!chosen && target.name === "visit-mississippi") {
              const fallback = "https://visitmississippi.org/wp-content/uploads/2025/03/birthplace-cover-poster-scaled.jpg";
              for (const method of ["direct", "in-page"]) {
                try {
                  buffer = method === "direct"
                    ? await downloadImage(page, fallback, target.url)
                    : await downloadImageInPage(page, fallback);
                  const meta = await sharp(buffer).metadata();
                  chosen = {
                    url:fallback,
                    kind:method === "direct" ? "known-video-poster" : "known-video-poster-same-origin-fetch",
                    intrinsicWidth:meta.width,
                    intrinsicHeight:meta.height,
                    score:0
                  };
                  break;
                } catch (e) {
                  errors.push(`known-poster ${method}: ${String(e)}`);
                }
              }
            }

            if (!chosen || !buffer) {
              try {
                buffer = await captureRenderedHero(page);
                const meta = await sharp(buffer).metadata();
                chosen = {
                  url:target.url,
                  kind:"rendered-hero-screenshot",
                  intrinsicWidth:meta.width,
                  intrinsicHeight:meta.height,
                  score:0
                };
                console.log(`${target.name}: binary image access failed; using rendered hero screenshot fallback.`);
              } catch (e) {
                errors.push(`rendered screenshot: ${String(e)}`);
              }
            }

            if (!chosen || !buffer) {
              throw new Error(`Could not resolve a clean hero image for ${target.url}. ${errors.slice(-8).join(" | ")}`);
            }

            await sharp(buffer)
              .rotate()
              .resize({width:1800, withoutEnlargement:true})
              .webp({quality:86, effort:5})
              .toFile(target.out);

            manifest[target.name] = {
              page: target.url,
              image: chosen.url,
              kind: chosen.kind,
              intrinsicWidth: chosen.intrinsicWidth,
              intrinsicHeight: chosen.intrinsicHeight,
              syncedAt: new Date().toISOString()
            };

            console.log(`${target.name}: ${chosen.kind} -> ${chosen.url}`);
            await context.close();
          }

          await browser.close();
          await fs.writeFile(
            "assets/external/source-manifest.json",
            JSON.stringify(manifest, null, 2) + "\n",
            "utf8"
          );
          EOF

          cd /tmp/ms-hero-sync
          node sync.mjs

      - name: Commit refreshed hero media
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/external
          if git diff --cached --quiet; then
            echo "External hero media already current."
            exit 0
          fi
          git commit -m "Refresh Mississippi resource hero images"
          git push
